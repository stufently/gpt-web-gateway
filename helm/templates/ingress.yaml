apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Must exceed the app's longest adaptive wait, or nginx cuts the connection first and the
    # caller gets nginx's own 504 instead of the gateway's structured error (`error_kind`,
    # `should_retry`) — losing the very envelope clients branch on.
    #
    # The two server-side ceilings, worst case:
    #   text   CF_LOAD_BUDGET_SEC 90 + CHAT_COMPLETION_TIMEOUT_SEC 600 + RETRY 180 = 870
    #   images CF_LOAD_BUDGET_SEC 90 + GENERATION_MAX_TIMEOUT_SEC 600             = 690
    # 960 clears the larger of those with margin. Raised from 720 on 2026-07-27 together with
    # the text budgets (the Pro tier can think for minutes); the client budgets above it were
    # raised in the same step — chat.sh/generate.sh use --max-time 1020.
    # Keep this ABOVE 90 + CHAT_COMPLETION_TIMEOUT_SEC + CHAT_COMPLETION_RETRY_TIMEOUT_SEC.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "960"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "960"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    {{- if .Values.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.auth.existingSecret | default (printf "%s-basic-auth" .Release.Name) }}
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    {{- end }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
